# Launch overlay for the dsh-plugins workspace. Applied over the base
# profile with:
#
#   node --import tsx/esm apps/cli/src/bin.ts web --patch <this file>
#
# (run from the vendored harness checkout). Relative entry paths are
# anchored to this file and compiled by the CLI's tsx loader; the
# @deepseek-ai/* peers resolve through the workspace-root tsconfig facade
# generated by tools/gen-tsconfig-paths.ts.
#
# shell-devenv is intentionally absent: it replaces the platform's shell
# executor with the devenv bash wrapper (its own cordis.patch.yml removes
# the bash-local row on POSIX hosts). On Windows the base profile mounts
# pwsh-sandbox, so mounting it here would swap a working shell for an
# unavailable one.

- insert:
    - id: provider-openai-codex
      name: './plugins/provider-openai-codex/src/index.ts'
    - id: provider-zai
      name: './plugins/provider-zai/src/index.ts'
    - id: fallback-router
      name: './plugins/fallback-router/src/index.ts'
    - id: web-search
      name: './plugins/web-search/src/index.ts'
    - id: command-model-links
      name: './plugins/command-model-links/src/index.ts'
    - id: command-usage-reset
      name: './plugins/command-usage-reset/src/index.ts'
    - id: skill-nix-packages
      name: './plugins/skill-nix-packages/src/index.ts'
    - id: system-prompt-agents-switch
      name: './plugins/system-prompt-agents-switch/src/index.ts'
    - id: provider-openrouter
      name: './plugins/provider-openrouter/src/index.ts'
    - id: llm-decision-models
      name: './plugins/llm-decision-models/src/index.ts'
    - id: provider-fal
      name: './plugins/provider-fal/src/index.ts'
    # system-prompt-replace is intentionally absent by default: mounting it
    # replaces dsh's built-in system prompt wholesale. Enable it only with
    # a prompt (inline or file) actually configured.
    # - id: system-prompt-replace
    #   name: './plugins/system-prompt-replace/src/index.ts'
